<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Assistant Archer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17283d"/>
      <stop offset="1" stop-color="#020a13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#8f98a2"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35a2ff"/>
      <stop offset="1" stop-color="#0067da"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- viseur / réglage -->
  <g fill="none" stroke="url(#metal)" stroke-width="13" stroke-linecap="round" filter="url(#shadow)">
    <circle cx="256" cy="238" r="150"/>
    <path d="M256 68v44M256 364v44M86 238h44M382 238h44"/>
  </g>
  <g fill="url(#metal)" stroke="#747e88" stroke-width="3" filter="url(#shadow)">
    <rect x="238" y="42" width="36" height="45" rx="9"/>
    <rect x="238" y="389" width="36" height="45" rx="9"/>
    <rect x="61" y="220" width="45" height="36" rx="9"/>
    <rect x="406" y="220" width="45" height="36" rx="9"/>
  </g>
  <g stroke="#69737d" stroke-width="4">
    <path d="M246 52h20M246 62h20M246 72h20M246 401h20M246 411h20M246 421h20"/>
    <path d="M71 230v16M81 230v16M91 230v16M418 230v16M428 230v16M438 230v16"/>
  </g>

  <!-- cible -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="238" r="100" fill="#f8f8f6"/>
    <circle cx="256" cy="238" r="82" fill="#111b27"/>
    <circle cx="256" cy="238" r="65" fill="#0878ea"/>
    <circle cx="256" cy="238" r="47" fill="#ef281f"/>
    <circle cx="256" cy="238" r="27" fill="#ffc629"/>
    <circle cx="256" cy="238" r="7" fill="#18202a"/>
  </g>

  <!-- repères fins de viseur -->
  <g stroke="#f8fbff" stroke-width="6" stroke-linecap="round">
    <path d="M256 95v45M256 336v45M113 238h45M354 238h45"/>
  </g>
  <g stroke="#f8fbff" stroke-width="4">
    <path d="M246 120h20M246 132h20M125 228v20M137 228v20M375 228v20M387 228v20"/>
  </g>

  <!-- flèche -->
  <g filter="url(#shadow)">
    <path d="M394 104L246 249" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M394 104L246 249" fill="none" stroke="#17283d" stroke-width="8" stroke-linecap="round"/>
    <path d="M238 258l13-32 20 20z" fill="#ffffff" stroke="#17283d" stroke-width="5"/>
    <path d="M388 109l9-55 34-27-9 55z" fill="url(#blue)" stroke="#dcecff" stroke-width="3"/>
    <path d="M402 120l55-2 33-24-55 1z" fill="url(#blue)" stroke="#dcecff" stroke-width="3"/>
  </g>

  <!-- nom simplifié, lisible même en icône -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" letter-spacing="4" fill="#ffffff">ARCHER</text>
  <path d="M125 474h262" stroke="#0787ff" stroke-width="5" stroke-linecap="round"/>
</svg>