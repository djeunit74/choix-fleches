name: Update Merchant Deals

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync deals
        env:
          DEALS_REMOTE_JSON_URL: ${{ secrets.DEALS_REMOTE_JSON_URL }}
          DEALS_REMOTE_CSV_URL: ${{ secrets.DEALS_REMOTE_CSV_URL }}
        run: node scripts/sync-deals.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- deals.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "Update merchant deals"
          git push
