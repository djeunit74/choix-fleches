name: Publier TEST vers public

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verifier la version TEST
        run: |
          test -f test/index.html || { echo "ERREUR: test/index.html absent"; exit 1; }
          test -f test/app.js || { echo "ERREUR: test/app.js absent"; exit 1; }
          test -f test/styles.css || { echo "ERREUR: test/styles.css absent"; exit 1; }

      - name: Copier TEST vers la racine publique sans supprimer TEST
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'test' \
            test/ ./

      - name: Publier sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La version publique est deja a jour"
            exit 0
          fi
          git commit -m "Publie la version TEST validee"
          git push origin main
