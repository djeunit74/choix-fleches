name: Audit factuel et non-regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe des sources actives
        run: |
          node --check app.js
          node --check app-config.js
          node --check reliability.js
          node --check foc-measure.js
          node --check verified-app.js
          node --check verified-engine.js
          node --check scripts/refresh-prices.mjs
      - name: Moteur verifie et parite public-test
        run: node --test scripts/verified-check.test.cjs
